name: Grade app checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Render the Streamlit home page
        run: python -c "from streamlit.testing.v1 import AppTest; app=AppTest.from_file('app.py').run(); assert not app.exception, app.exception"
